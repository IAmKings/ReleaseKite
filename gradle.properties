# Gradle daemon / 编码
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 发布坐标（publishing.gradle.kts / JitPack / 宿主项目引用）
# 使用 JitPack 兼容 group：com.github.<owner>.<Repo>，三模块的 POM/mavenLocal 坐标与 JitPack
# 多模块消费坐标一致（避免 JitPack 不重写 Gradle module metadata 的已知限制）。
# 若要发布到 Maven Central/GitHub Packages，可覆盖为
#   ./gradlew publish -PGROUP=io.github.iamkings
GROUP=com.github.IAmKings.ReleaseKite
VERSION_NAME=0.1.0

# POM url/scm 元数据（CI 也会从 GITHUB_REPOSITORY 推导；本地默认指向真实仓库）
POM_URL=https://github.com/IAmKings/ReleaseKite
