# Gradle daemon / 编码
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 发布坐标（publishing.gradle.kts / JitPack / 宿主项目引用）
GROUP=io.github.releasekite
VERSION_NAME=0.1.0

# 发布前按真实仓库覆盖（POM url/scm 元数据；未设置时 CI 从 GITHUB_REPOSITORY 推导）
# POM_URL=https://github.com/<owner>/ReleaseKite
#
# JitPack 说明：JitPack 多模块坐标使用 com.github.<owner>.<Repo>:<module>:<tag>，
# 与默认 GROUP=io.github.releasekite 不一致时，JitPack 构建需用
#   ./gradlew publishToMavenLocal -PGROUP=com.github.<owner>.ReleaseKite
# 或改用 GitHub Packages / Maven Central 发布后再接入（见 README）。
