name: Publish GitHub Packages

# 把三个库模块发布到 GitHub Packages（Maven）。
# 触发：手动 workflow_dispatch，或 GitHub Release published。
# 需要 packages: write；使用仓库自带 GITHUB_TOKEN，无需额外 Secrets。
#
# 消费端需要带 read:packages 的 token（见 README「GitHub Packages」）。
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish Maven artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub hosted runner 已包含 Android SDK；不要用 setup-android@v3（其 tools 包已不存在）。
      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::Android SDK env 未设置"; exit 1; }
          ls "$SDK/platforms"
          ls "$SDK/build-tools" | tail -3

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      # 先检查全部模块，再只发布完全缺失的模块；不覆盖已发布或半成品版本。
      - name: Publish missing modules and verify artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | head -1)"
          GROUP="$(sed -n 's/^GROUP=//p' gradle.properties | head -1)"
          [ -n "$VERSION" ] && [ -n "$GROUP" ] || { echo "::error::Missing publication coordinates"; exit 1; }
          GROUP_PATH="${GROUP//./\/}"
          BASE="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/${GROUP_PATH}"
          modules=("releasekite-core:jar" "releasekite:aar" "releasekite-compose:aar")
          tasks=()

          artifact_code() {
            local url="${BASE}/$1/${VERSION}/$1-${VERSION}.$2"
            curl -sSL -m 30 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" "$url"
          }

          for spec in "${modules[@]}"; do
            module="${spec%%:*}"
            binary="${spec##*:}"
            present=0
            for ext in pom "$binary"; do
              code="$(artifact_code "$module" "$ext")"
              echo "$code ${module}-${VERSION}.${ext}"
              case "$code" in
                200) present=$((present + 1)) ;;
                404) ;;
                *) echo "::error::Cannot determine package state: $module.$ext (HTTP $code)"; exit 1 ;;
              esac
            done
            case "$present" in
              0) tasks+=(":${module}:publishReleasePublicationToGitHubPackagesRepository") ;;
              2) echo "Complete package $module:$VERSION exists; skip immutable re-publish." ;;
              *) echo "::error::Incomplete package $module:$VERSION. Do not overwrite it; publish a new version."; exit 1 ;;
            esac
          done

          if [ "${#tasks[@]}" -gt 0 ]; then
            ./gradlew --no-daemon --stacktrace "${tasks[@]}"
          fi

          for spec in "${modules[@]}"; do
            module="${spec%%:*}"
            binary="${spec##*:}"
            for ext in pom "$binary"; do
              code="$(artifact_code "$module" "$ext")"
              echo "$code ${module}-${VERSION}.${ext}"
              [ "$code" = "200" ] || { echo "::error::Published artifact unavailable: $module.$ext (HTTP $code)"; exit 1; }
            done
          done
