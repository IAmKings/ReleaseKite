name: CI

# ReleaseKite 质量门禁：
#   1. 纯 JVM 领域层单测            :releasekite-core:test（230 例的一部分）
#   2. Android 适配层单测           :releasekite:testDebugUnitTest（Robolectric）
#   3. Compose UI 单测              :releasekite-compose:testDebugUnitTest（Robolectric）
#   4. Debug 示例可构建             :sample:assembleDebug
#   5. Debug lint（error 级阻断）   :releasekite / :releasekite-compose / :sample 的 lintDebug
#   6. Release 门禁                 :releasekite/:releasekite-compose 的 assembleRelease（AAR）
#                                   + :sample:assembleRelease（R8/minify + resource shrink）
#   7. Release lint（error 级阻断） :releasekite / :releasekite-compose / :sample 的 lintRelease
#   8. 发布产物可生成               :releasekite-core/:releasekite/:releasekite-compose 的 publishToMavenLocal
#   任何一步失败都会上传测试/失败报告 artifact 便于排障。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧跑，节省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: tests + debug/release build + lint + publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub ubuntu-latest 自带来 Android SDK；不要再用 android-actions/setup-android@v3
      # （其 `sdkmanager tools` 在新版 cmdline-tools 已不存在，会直接让 job 失败）。
      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::Android SDK env 未设置"; exit 1; }
          ls "$SDK/platforms"
          ls "$SDK/build-tools" | tail -3

      # 供应链校验：确认 gradle-wrapper.jar 与官方发布一致
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Release metadata policy tests
        run: python3 scripts/test-release-metadata.py

      - name: Validate AI skills
        run: python3 scripts/test-skills.py

      - name: Unit tests (core / android / compose)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite-core:test \
            :releasekite:testDebugUnitTest \
            :releasekite-compose:testDebugUnitTest

      - name: Debug sample build
        run: ./gradlew --no-daemon --stacktrace :sample:assembleDebug

      - name: Debug lint
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite:lintDebug \
            :releasekite-compose:lintDebug \
            :sample:lintDebug

      # Release AAR（库模块）与 R8 sample（示例自带 minify/shrink 门禁）都必须可构建。
      - name: Release builds (AAR + R8 sample)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite:assembleRelease \
            :releasekite-compose:assembleRelease \
            :sample:assembleRelease

      - name: Release lint
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite:lintRelease \
            :releasekite-compose:lintRelease \
            :sample:lintRelease

      # 坐标/产物完整性：三个库模块可发布到 Maven Local（JitPack 走根 install 聚合任务）。
      - name: Publish to Maven Local
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite-core:publishToMavenLocal \
            :releasekite:publishToMavenLocal \
            :releasekite-compose:publishToMavenLocal

      # 发布物消费端冒烟：独立最小 Compose App 仅通过 mavenLocal 坐标依赖，R8 minify+shrink
      # 构建 release；验证 POM/Gradle metadata、Compose api scope 与 consumer ProGuard 规则。
      - name: Consumer smoke (mavenLocal AAR + R8)
        run: bash scripts/consumer-smoke.sh

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/lint-results/**
            **/build/outputs/mapping/**
            **/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 7
