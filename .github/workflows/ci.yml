name: CI

# ReleaseKite 质量门禁：
#   1. 纯 JVM 领域层单测        :releasekite-core:test
#   2. Android 适配层单测       :releasekite:testDebugUnitTest（Robolectric）
#   3. Compose UI 单测          :releasekite-compose:testDebugUnitTest（Robolectric）
#   4. 示例应用可构建           :sample:assembleDebug
#   5. lint（error 级阻断）     :releasekite / :releasekite-compose / :sample 的 lintDebug
#   任何一步失败都会上传测试/失败报告 artifact 便于排障。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧跑，节省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: unit tests + lint + sample build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 供应链校验：确认 gradle-wrapper.jar 与官方发布一致
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core / android / compose)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite-core:test \
            :releasekite:testDebugUnitTest \
            :releasekite-compose:testDebugUnitTest

      - name: Sample app build
        run: ./gradlew --no-daemon --stacktrace :sample:assembleDebug

      - name: Lint
        run: |
          ./gradlew --no-daemon --stacktrace \
            :releasekite:lintDebug \
            :releasekite-compose:lintDebug \
            :sample:lintDebug

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/lint-results/**
          if-no-files-found: warn
          retention-days: 7
