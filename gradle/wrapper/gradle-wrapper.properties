distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ---------------------------------------------------------------------------
# Gradle 发行包完整性校验（Gradle 8.14.3 bin）
# 官方 sha256 来源：
#   https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256
# wrapper 下载后会用此值校验；文件损坏/被篡改会直接失败（不要为绕过而删除）。
# 换版本时必须同步更新该值（sha256 与版本一一对应）。
# ---------------------------------------------------------------------------
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
# ---------------------------------------------------------------------------
# 发行包来源：使用 Gradle 官方分发（GitHub Releases 托管，全球可达）。
# 本机已缓存同版本官方包（wrapper URL hash 命中 ~/.gradle/wrapper/dists），
# 国内网络若无法访问官方源，可临时改为本地镜像，但必须保留 distributionSha256Sum。
# ---------------------------------------------------------------------------
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
